<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nibble OG image</title>
<!--
  Generates public/og.jpg (link preview). Render at 1200x630, device scale 2, then downscale:
  see tools/og/README.md. Photos: "Cherry blossom buds 1" by W.carter (public domain) and
  "Green leaf with sunlight" by Joselodos (CC0), both from Wikimedia Commons.
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column;
    justify-content: center; color: #2b2522; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .text h1 { margin: 0; font-size: 92px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; }
  .text p { margin: 22px 0 0; font-size: 24px; line-height: 1.4; color: #4a413c; }
  .text .url { position: absolute; bottom: 58px; left: 0; display: flex; align-items: center; gap: 12px;
    font-size: 22px; color: #6b5f58; }
  .text .url svg { width: 26px; height: 26px; }
  /* same magazine texture as the site */
  .grain, .halftone { position: absolute; inset: 0; pointer-events: none; }
  .grain { mix-blend-mode: soft-light; opacity: 0.9; }
  .halftone { inset: -50%; transform: rotate(15deg); opacity: 0.1; mix-blend-mode: multiply;
    background: radial-gradient(circle, #000 0 30%, transparent 55%) 0 0 / 3px 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text">
  <h1>Nibble</h1>
  <p>Random photographs, punched with hand-cut holes and stacked.</p>
  <div class="url"><svg viewBox="-1.25 -1.25 2.5 2.5"><path fill="#f48fb1" id="sakura"/></svg>nibble.pictures</div>
</div>
<div class="halftone"></div>
<div class="grain"></div>
<script>
const W = 1200, H = 630, DPR = window.devicePixelRatio || 1;
const PHOTOS = {
  leaf: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/Green_leaf_with_sunlight.jpg/3840px-Green_leaf_with_sunlight.jpg',
  buds: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Cherry_blossom_buds_1.jpg/3840px-Cherry_blossom_buds_1.jpg',
};
const SAKURA = 'M1.064 -0.112L1.113 -0.045L1.143 0.028L1.137 0.093L1.084 0.138L1.014 0.166L0.968 0.191L0.978 0.227L1.018 0.273L1.057 0.329L1.056 0.388L1.021 0.447L0.960 0.497L0.887 0.534L0.813 0.557L0.733 0.565L0.651 0.556L0.572 0.533L0.501 0.500L0.432 0.455L0.395 0.431L0.400 0.451L0.429 0.504L0.465 0.580L0.491 0.664L0.503 0.750L0.499 0.836L0.480 0.920L0.445 0.999L0.394 1.066L0.333 1.117L0.267 1.130L0.207 1.090L0.160 1.042L0.120 1.005L0.087 1.016L0.056 1.073L0.014 1.128L-0.043 1.150L-0.112 1.133L-0.179 1.085L-0.235 1.019L-0.280 0.949L-0.310 0.869L-0.325 0.785L-0.326 0.700L-0.311 0.611L-0.291 0.538L-0.280 0.495L-0.295 0.503L-0.337 0.548L-0.396 0.603L-0.463 0.649L-0.538 0.685L-0.619 0.708L-0.708 0.721L-0.789 0.711L-0.871 0.688L-0.942 0.649L-0.979 0.596L-0.971 0.533L-0.938 0.472L-0.917 0.424L-0.941 0.398L-1.005 0.386L-1.072 0.364L-1.107 0.314L-1.111 0.243L-1.088 0.165L-1.046 0.091L-0.993 0.027L-0.929 -0.026L-0.864 -0.068L-0.784 -0.096L-0.696 -0.110L-0.618 -0.114L-0.573 -0.116L-0.587 -0.129L-0.644 -0.156L-0.718 -0.196L-0.785 -0.248L-0.850 -0.312L-0.897 -0.384L-0.931 -0.464L-0.943 -0.544L-0.939 -0.626L-0.918 -0.702L-0.871 -0.749L-0.802 -0.754L-0.731 -0.738L-0.677 -0.730L-0.653 -0.754L-0.663 -0.819L-0.661 -0.886L-0.628 -0.937L-0.564 -0.964L-0.485 -0.967L-0.405 -0.954L-0.328 -0.925L-0.259 -0.882L-0.198 -0.825L-0.148 -0.759L-0.110 -0.688L-0.082 -0.616L-0.066 -0.575L-0.058 -0.587L-0.050 -0.652L-0.035 -0.733L-0.007 -0.808L0.034 -0.888L0.086 -0.955L0.150 -1.010L0.225 -1.057L0.305 -1.086L0.385 -1.093L0.447 -1.070L0.479 -1.015L0.487 -0.944L0.498 -0.892L0.532 -0.883L0.594 -0.914L0.662 -0.936L0.719 -0.916L0.765 -0.861L0.791 -0.781L0.801 -0.696L0.791 -0.608L0.767 -0.525L0.728 -0.447L0.679 -0.377L0.619 -0.316L0.557 -0.266L0.522 -0.238L0.538 -0.235L0.605 -0.249L0.687 -0.260L0.771 -0.258L0.852 -0.242L0.931 -0.212L0.997 -0.168Z';   // public/favicon.svg
const PAPER = '#efe7da';
const R = 62;                        // hole radius (px)
const SHADOWS = [                    // as on the site: warm ambient + dark contact, per unit of height
  { color: 'rgb(150, 118, 98)', dx: 3, dy: 6, blur: 9 },
  { color: 'rgb(84, 62, 52)', dx: 1, dy: 2, blur: 2.5 },
];

function mulberry32(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// hand-punched circle, same wobble as the site's circle shape
function wobblyCircle(path, x, y, r, rnd) {
  const waves = [2, 3, 5, 7].map(k => ({ k, a: 0.025 * rnd() / Math.sqrt(k), p: rnd() * 6.283 }));
  for (let j = 0; j < 90; j++) {
    const t = j / 90 * Math.PI * 2;
    let f = 1 + 0.005 * (rnd() * 2 - 1);
    for (const w of waves) f += w.a * Math.sin(w.k * t + w.p);
    j ? path.lineTo(x + Math.cos(t) * r * f, y + Math.sin(t) * r * f) : path.moveTo(x + Math.cos(t) * r * f, y + Math.sin(t) * r * f);
  }
  path.closePath();
}
// holes scattered evenly (one per jittered grid cell) inside a region
function holes(seed, x0, x1, cols, rows, keep) {
  const rnd = mulberry32(seed), path = new Path2D();
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const x = x0 + (i + 0.15 + rnd() * 0.7) * (x1 - x0) / cols, y = (j + 0.15 + rnd() * 0.7) * H / rows;
    if (rnd() < keep) wobblyCircle(path, x, y, R, rnd);
  }
  return path;
}
const load = src => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });
const cover = (ctx, img) => {
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
};
const layer = () => {
  const c = document.createElement('canvas');
  c.width = W * DPR; c.height = H * DPR;
  const x = c.getContext('2d'); x.scale(DPR, DPR); x.imageSmoothingQuality = 'high';
  return [c, x];
};
// a sheet's shadow: its solid shape, offset and blurred, multiplied onto what's below
function castShadow(ctx, hole, height) {
  for (const s of SHADOWS) {
    const [c, x] = layer(), m = 40;
    x.fillStyle = s.color;
    x.fillRect(-m, -m, W + 2 * m, H + 2 * m);
    x.globalCompositeOperation = 'destination-out';
    x.fill(hole);
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.filter = `blur(${s.blur * height}px)`;
    ctx.drawImage(c, s.dx * height, s.dy * height, W, H);
    ctx.restore();
  }
}

(async () => {
  const [leaf, buds] = await Promise.all([load(PHOTOS.leaf), load(PHOTOS.buds)]);
  const canvas = document.getElementById('c');
  canvas.width = W * DPR; canvas.height = H * DPR;
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR); ctx.imageSmoothingQuality = 'high';

  cover(ctx, leaf);                                         // bottom: leaf, uncut

  const budHoles = holes(11, 560, W + 40, 6, 4, 0.75);      // middle: blossom buds, punched
  castShadow(ctx, budHoles, 1);
  const [bc, bx] = layer();
  bx.drawImage(buds, -150, -6, 1500, 1500 * buds.naturalHeight / buds.naturalWidth);   // branch runs through the holes
  bx.globalCompositeOperation = 'destination-out'; bx.fill(budHoles);
  ctx.drawImage(bc, 0, 0, W, H);

  const paperHoles = holes(7, 600, W + 60, 5, 4, 0.8);      // top: paper card, punched on the right only
  castShadow(ctx, paperHoles, 2);
  const [pc, px] = layer();
  px.fillStyle = PAPER; px.fillRect(0, 0, W, H);
  px.globalCompositeOperation = 'destination-out'; px.fill(paperHoles);
  ctx.drawImage(pc, 0, 0, W, H);

  // grain tile, as on the site
  const T = 256, g = document.createElement('canvas'); g.width = g.height = T;
  const gx = g.getContext('2d'), gi = gx.createImageData(T, T), rnd = mulberry32(3);
  for (let i = 0; i < gi.data.length; i += 4) {
    const v = 128 + (rnd() + rnd() - 1) * 110;
    gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = v; gi.data[i + 3] = 255;
  }
  gx.putImageData(gi, 0, 0);
  document.querySelector('.grain').style.background = `url(${g.toDataURL()}) 0 0 / ${T / DPR}px ${T / DPR}px`;

  // favicon sakura beside the URL
  document.getElementById('sakura').setAttribute('d', SAKURA);
  document.title = 'READY';
})();
</script>
</body>
</html>
